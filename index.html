<style>

:root{
  --ceu:#F4F7FC; --papel:#FFFFFF; --nicho:#EEF3FA; --manto:#6F95CC; --manto-fundo:#2C4A7C; --tinta:#1F2A44; --tinta-2:#55607A;
  --ouro:#B8924A; --ouro-claro:#E9DCC0; --linha:#DCE5F2; --verde:#2F6B45; --verde-claro:#DCEFE0; --alerta:#9B3B3B;
  --sombra:0 18px 40px -24px rgba(44,74,124,.45);
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Josefin Sans", "Avenir Next", "Segoe UI", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ceu:#121A2B; --papel:#1A2438; --nicho:#22304A; --manto:#8FB0DE; --manto-fundo:#9DBBE6; --tinta:#EEF2F8; --tinta-2:#B5C0D4;
  --ouro:#D6B472; --ouro-claro:#4A3F2A; --linha:#2C3A55; --verde:#8FD1A5; --verde-claro:#1F3A2B; --alerta:#E39A9A; --sombra:0 18px 40px -24px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --ceu:#121A2B; --papel:#1A2438; --nicho:#22304A; --manto:#8FB0DE; --manto-fundo:#9DBBE6; --tinta:#EEF2F8; --tinta-2:#B5C0D4;
  --ouro:#D6B472; --ouro-claro:#4A3F2A; --linha:#2C3A55; --verde:#8FD1A5; --verde-claro:#1F3A2B; --alerta:#E39A9A; --sombra:0 18px 40px -24px rgba(0,0,0,.7); color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ceu);color:var(--tinta);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;gap:18px;height:64px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marca .med{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--linha)}
.marca .med img{width:40px}
.marca b{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.2px}
.topo nav{margin-left:auto;display:flex;gap:22px;align-items:center}
.topo nav a{color:var(--tinta-2);text-decoration:none;font-size:15px}
.topo nav a:hover{color:var(--manto-fundo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;text-decoration:none;font-family:var(--sans);font-weight:600;font-size:15px;line-height:1;transition:transform .15s, background .15s}
.btn:active{transform:translateY(1px)}
.btn-zap{background:#1F8F55;color:#fff}
.btn-zap:hover{background:#18784A}
.btn-manto{background:var(--manto-fundo);color:var(--papel)}
.btn-linha{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1px var(--linha)}
.btn-linha:hover{box-shadow:inset 0 0 0 1px var(--manto)}
.btn-pequeno{padding:9px 14px;font-size:14px}
@media (max-width:720px){.topo nav a.lnk{display:none}.marca b{font-size:18px}}

/* abertura */
.abertura{position:relative;overflow:hidden;text-align:center;padding:56px 20px 40px}
.abertura .arco{position:absolute;left:50%;top:-40%;width:min(1100px,160vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:2px solid var(--linha);pointer-events:none}
.abertura .arco.dois{top:-30%;width:min(900px,130vw);border-color:color-mix(in srgb,var(--ouro) 35%,transparent)}
.medalhao{position:relative;width:min(300px,68vw);aspect-ratio:1;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sombra);overflow:hidden}
.medalhao img{width:94%}
.abertura h1{position:relative;font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1.08;margin:28px auto 12px;max-width:20ch;text-wrap:balance}
.abertura p{position:relative;color:var(--tinta-2);max-width:52ch;margin:0 auto 26px;font-size:17px}
.abertura .acoes{position:relative;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lema{position:relative;margin-top:30px;font-family:var(--sans);font-size:12.5px;letter-spacing:.32em;color:var(--ouro)}

/* filtros */
.filtros{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:var(--ceu);padding:14px 0;border-bottom:1px solid var(--linha)}
.filtros .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--linha);background:var(--papel);color:var(--tinta-2);border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--manto-fundo);border-color:var(--manto-fundo);color:var(--papel)}
.busca{display:flex;align-items:center;gap:8px;background:var(--papel);border:1px solid var(--linha);border-radius:999px;padding:0 14px;min-width:220px}
.busca input{border:0;background:transparent;padding:9px 0;outline:none;width:100%}
@media (max-width:720px){.busca{min-width:0;flex:1 1 100%}}

/* vitrine */
.vitrine{padding-top:34px;padding-bottom:20px}
.cab-secao{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.cab-secao h2{font-family:var(--serif);font-weight:600;font-size:32px;margin:0}
.cab-secao span{color:var(--tinta-2);font-size:14.5px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:30px 24px}
.peca{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;position:relative}
.nicho{position:relative;aspect-ratio:4/5;border-radius:999px 999px 18px 18px;background:var(--nicho);overflow:hidden;box-shadow:var(--sombra)}
.nicho::after{content:"";position:absolute;inset:8px;border-radius:999px 999px 12px 12px;border:1px solid color-mix(in srgb,var(--ouro) 70%,transparent);pointer-events:none}
.nicho img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.peca:hover .nicho img{transform:scale(1.04)}
.selos{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.selo{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--papel);color:var(--manto-fundo);font-weight:600}
.selo.ouro{background:var(--ouro);color:#fff}
.selo.cinza{background:var(--tinta);color:var(--papel)}
.selo.rascunho{background:#FCE9C8;color:#7A5410}
.peca h3{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.15;margin:16px 0 4px}
.peca .resumo{color:var(--tinta-2);font-size:14.5px;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--manto-fundo)}
.preco small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--tinta-2);margin-left:4px}
.atac{font-size:13.5px;color:var(--verde);margin-top:2px}
.vazio{text-align:center;padding:60px 20px;color:var(--tinta-2)}
.vazio strong{display:block;font-family:var(--serif);font-size:26px;color:var(--tinta);margin-bottom:6px}

/* como comprar */
.passos{padding:60px 0;border-top:1px solid var(--linha);margin-top:40px}
.passos h2{font-family:var(--serif);font-weight:600;font-size:32px;margin:0 0 26px;text-align:center}
.passos ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;counter-reset:p}
.passos li{counter-increment:p;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:22px}
.passos li::before{content:counter(p);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--ouro);color:var(--ouro);font-family:var(--serif);font-size:22px;margin-bottom:12px}
.passos li b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.passos li span{color:var(--tinta-2);font-size:14.5px}
.rodape{text-align:center;padding:40px 20px 120px;color:var(--tinta-2);font-size:14px}
.rodape .med{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.rodape .med img{width:78px}
.rodape a{color:var(--manto-fundo)}

/* janela da peça */
dialog{border:0;padding:0;background:transparent;max-width:min(980px,100vw);width:100%;color:var(--tinta)}
dialog::backdrop{background:rgba(18,26,43,.6);backdrop-filter:blur(3px)}
.janela{background:var(--papel);border-radius:24px;display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;max-height:calc(100dvh - 40px)}
.galeria{background:var(--nicho);padding:22px;display:flex;flex-direction:column;gap:12px}
.galeria .principal{aspect-ratio:4/5;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--papel)}
.galeria .principal img{width:100%;height:100%;object-fit:cover}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap}
.miniaturas button{width:58px;height:58px;border-radius:12px;overflow:hidden;padding:0;border:2px solid transparent;cursor:pointer;background:var(--papel)}
.miniaturas button[aria-current="true"]{border-color:var(--ouro)}
.miniaturas img{width:100%;height:100%;object-fit:cover}
.info{padding:30px 30px 26px;overflow:auto;display:flex;flex-direction:column}
.info .cat{color:var(--ouro);font-size:14px}
.info h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.08;margin:4px 0 12px}
.info p.desc{margin:0 0 16px;color:var(--tinta-2);white-space:pre-line}
.detalhes{margin:0 0 18px;padding:0;display:grid;gap:8px}
.detalhes div{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:14.5px;border-bottom:1px dashed var(--linha);padding-bottom:8px}
.detalhes dt{color:var(--tinta-2)} .detalhes dd{margin:0}
.tabela-precos{border:1px solid var(--linha);border-radius:14px;overflow:hidden;margin-bottom:18px}
.tabela-precos div{display:flex;justify-content:space-between;padding:10px 14px;font-size:15px}
.tabela-precos div+div{border-top:1px solid var(--linha)}
.tabela-precos div.ativo{background:var(--verde-claro);color:var(--verde);font-weight:600}
.qtd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qtd .ctrl{display:flex;align-items:center;border:1px solid var(--linha);border-radius:999px;overflow:hidden}
.qtd .ctrl button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;font-size:20px}
.qtd .ctrl input{width:54px;text-align:center;border:0;background:transparent;font-weight:600}
.total{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--manto-fundo)}
.fechar{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--papel);box-shadow:var(--sombra);cursor:pointer;font-size:20px;z-index:2}
.info .acoes{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.janela{grid-template-columns:1fr;max-height:calc(100dvh - 20px)}.galeria{padding:14px}.galeria .principal{aspect-ratio:1/1;border-radius:18px}.info{padding:22px 20px}dialog{margin:auto 0 0}}

@media (max-width:720px){.grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.peca h3{font-size:19px}.preco{font-size:21px}.peca .resumo{font-size:13.5px}.cab-secao h2{font-size:27px}.selo{font-size:11px;padding:4px 8px}.selos{left:10px;bottom:10px}}
.redes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.rede{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;text-decoration:none;color:#fff;box-shadow:var(--sombra);transition:transform .15s}
.rede:hover{transform:translateY(-2px)}
.rede svg{width:34px;height:34px;padding:6px;border-radius:50%;background:rgba(255,255,255,.18);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rede span{display:flex;flex-direction:column;text-align:left;line-height:1.15}
.rede b{font-weight:600;font-size:15px}.rede small{font-size:12.5px;opacity:.85}
.rede-insta{background:var(--manto-fundo);color:var(--papel)}
.rede-zap{background:#1F8F55}
.rodape .rede{color:#fff}.rodape .rede-insta{color:var(--papel)}
.selos-linha{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.selos-linha .selo{box-shadow:inset 0 0 0 1px var(--linha)}
.selos-linha .selo.ouro,.selos-linha .selo.cinza{box-shadow:none}
.selos-linha + h3{margin-top:8px}
.galeria .principal{aspect-ratio:auto;border-radius:16px;background:var(--papel);display:flex;align-items:center;justify-content:center;min-height:240px;overflow:hidden}
.galeria .principal img{width:100%;height:auto;max-height:min(72dvh,700px);object-fit:contain}
.miniaturas img{object-fit:cover}
.galeria{overflow-y:auto}
dialog{max-height:none;overflow:visible}
.janela{max-height:calc(100dvh - 40px)}
@media (min-width:761px){.info,.galeria{max-height:calc(100dvh - 40px)}.info{overflow-y:auto}}
.info .acoes{position:sticky;bottom:0;background:var(--papel);padding-top:12px;margin-top:auto;z-index:1}
@media (max-width:760px){
 dialog{margin:auto 0 0;max-height:none}
 .janela{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(100dvh - 24px);border-radius:22px 22px 0 0}
 .galeria{overflow:visible}
 .info{overflow:visible;padding-bottom:0}
 .info .acoes{padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -10px rgba(0,0,0,.18)}
 .galeria .principal{border-radius:14px;min-height:160px}
 .galeria .principal img{max-height:46dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>

function categorias(){const u=new Set(pecas().map(p=>p.categoria).filter(Boolean));return ["Todos",...CATS.filter(c=>u.has(c)),...[...u].filter(c=>!CATS.includes(c))]}
function render(){
  const L=estado.loja||{}; const zap=zapUrl("Olá! Vi o catálogo da Terços de Jesus e Maria e gostaria de mais informações."); const insta=String(L.instagram||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/\/.*$/,"");
  const lista=visiveis(); const total=pecas().length;
  $("#app").innerHTML=`
  <header class="topo"><div class="wrap">
    <a class="marca" href="#inicio"><span class="med"><img src="${LOGO}" alt=""></span><b>Terços de Jesus e Maria</b></a>
    <nav><a class="lnk" href="#pecas">Peças</a><a class="lnk" href="#como-comprar">Como comprar</a>
    ${zap?`<a class="btn btn-zap btn-pequeno" href="${zap}" target="_blank" rel="noopener">WhatsApp</a>`:""}</nav>
  </div></header>
  <section class="abertura" id="inicio"><div class="arco"></div><div class="arco dois"></div>
    <div class="medalhao"><img src="${LOGO}" alt="Terços de Jesus e Maria"></div>
    <h1>${esc(L.titulo||"Terços feitos à mão, conta por conta")}</h1><p>${esc(L.mensagem||"")}</p>
    <div class="acoes"><a class="btn btn-manto" href="#pecas">Ver as peças</a>${zap?`<a class="btn btn-linha" href="${zap}" target="_blank" rel="noopener">Falar no WhatsApp</a>`:""}</div>
    <div class="lema">FÉ QUE REZA, AMOR QUE UNE.</div></section>
  <div class="filtros"><div class="wrap">
    <div class="chips" role="group" aria-label="Categorias">${categorias().map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===filtro}">${esc(c)}</button>`).join("")}</div>
    <label class="busca"><span aria-hidden="true">⌕</span><input id="busca" type="search" placeholder="Buscar peça" value="${esc(termo)}" aria-label="Buscar peça"></label>
  </div></div>
  <main class="vitrine wrap" id="pecas">
    <div class="cab-secao"><h2>${filtro==="Todos"?"Nossas peças":esc(filtro)}</h2><span>${lista.length} ${lista.length===1?"peça":"peças"}</span></div>
    ${lista.length?`<div class="grade">${lista.map(cartao).join("")}</div>`:`<div class="vazio"><strong>${total?"Nenhuma peça encontrada":"Novas peças chegando"}</strong>${total?"Tente outra categoria ou outra palavra na busca.":"Volte em breve ou chame no WhatsApp para encomendar."}</div>`}
  </main>
  <section class="passos" id="como-comprar"><div class="wrap"><h2>Como comprar</h2><ol>
    <li><b>Escolha</b><span>Veja as peças e toque na que gostar para ver fotos, detalhes e preços.</span></li>
    <li><b>Chame no WhatsApp</b><span>O botão já envia o nome da peça e a quantidade. Combinamos cores, nome e detalhes.</span></li>
    <li><b>Pague</b><span>${esc(L.pagamento||"Pagamento por Pix.")}</span></li>
    <li><b>Receba</b><span>${esc(L.prazo||"")} ${esc(L.envio||"")}</span></li></ol></div></section>
  <footer class="rodape"><div class="med"><img src="${LOGO}" alt=""></div>
    ${(insta||zap)?`<div class="redes">
      ${insta?`<a class="rede rede-insta" href="https://instagram.com/${esc(insta)}" target="_blank" rel="noopener" aria-label="Instagram @${esc(insta)}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg><span><b>Instagram</b><small>@${esc(insta)}</small></span></a>`:""}
      ${zap?`<a class="rede rede-zap" href="${zap}" target="_blank" rel="noopener" aria-label="Conversar no WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><circle cx="8.5" cy="11" r=".6"/><circle cx="12" cy="11" r=".6"/><circle cx="15.5" cy="11" r=".6"/></svg><span><b>WhatsApp</b><small>Fale com a gente</small></span></a>`:""}
    </div>`:""}
    <div>Terços de Jesus e Maria, feitos à mão com oração</div></footer>`;
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filtro=b.dataset.cat;render();$("#pecas").scrollIntoView({block:"start"})});
  const bi=$("#busca"); bi.oninput=()=>{termo=bi.value;const pos=bi.selectionStart;render();const n=$("#busca");n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll("[data-abrir]").forEach(b=>b.onclick=()=>abrirPeca(b.dataset.abrir));
}
function cartao(p){
  const f=faixas(p)[0];
  const selos=[p.novidade?'<span class="selo ouro">Novidade</span>':"",p.personalizavel?'<span class="selo">Personalizável</span>':"",p.status==="esgotado"?'<span class="selo cinza">Esgotado</span>':""].join("");
  return `<button class="peca" data-abrir="${esc(p.id)}" aria-label="Ver ${esc(p.nome)}">
    <div class="nicho"><img src="${foto(p.fotos&&p.fotos[0])||placeholder}" alt="${esc(p.nome)}" loading="lazy"></div>
    ${selos?`<div class="selos-linha">${selos}</div>`:""}
    <h3>${esc(p.nome)}</h3><p class="resumo">${esc(p.descricao||"")}</p>
    <div class="preco">${num(p.preco)?brl(p.preco)+"<small>cada</small>":"Sob consulta"}</div>
    ${f?`<div class="atac">A partir de ${num(f.qtd)} un.: ${brl(f.preco)} cada</div>`:""}</button>`;
}
let dlg;
function abrirPeca(id){
  const p=estado.pecas.find(x=>x.id===id); if(!p)return;
  const fotos=(p.fotos&&p.fotos.length)?p.fotos.map(foto):[placeholder]; let q=1, idx=0;
  const det=[["Materiais",p.materiais],["Medidas",p.medidas],["Cores",p.cores],["Personalização",p.personalizacao],["Prazo",estado.loja.prazo]].filter(d=>d[1]);
  const f=faixas(p);
  if(!dlg){dlg=document.createElement("dialog");document.body.appendChild(dlg);dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});dlg.addEventListener("close",()=>{if(location.hash.startsWith("#peca-"))history.replaceState(null,"",location.pathname+location.search)})}
  function desenhar(){
    const pr=precoPara(p,q);
    const linhas=[{t:"1 unidade",v:num(p.preco),a:!f.some(x=>q>=num(x.qtd))},...f.map((x,i)=>({t:`A partir de ${num(x.qtd)} unidades`,v:num(x.preco),a:q>=num(x.qtd)&&!(f[i+1]&&q>=num(f[i+1].qtd))}))];
    const zap=zapUrl(`Olá! Vi no catálogo e tenho interesse em:\n• ${p.nome} – ${q} ${q===1?"unidade":"unidades"}${pr?` (${brl(pr)} cada)`:""}\nPode me ajudar?`);
    dlg.innerHTML=`<div class="janela" style="position:relative"><button class="fechar" aria-label="Fechar">×</button>
      <div class="galeria"><div class="principal"><img src="${fotos[idx]}" alt="${esc(p.nome)}"></div>
      ${fotos.length>1?`<div class="miniaturas">${fotos.map((u,i)=>`<button data-i="${i}" aria-current="${i===idx}" aria-label="Foto ${i+1}"><img src="${u}" alt=""></button>`).join("")}</div>`:""}</div>
      <div class="info"><div class="cat">${esc(p.categoria||"")}</div><h2>${esc(p.nome)}</h2>
      ${(p.novidade||p.personalizavel||p.status==="esgotado")?`<div class="selos-linha" style="margin:0 0 14px">${p.novidade?'<span class="selo ouro">Novidade</span>':""}${p.personalizavel?'<span class="selo">Personalizável</span>':""}${p.status==="esgotado"?'<span class="selo cinza">Esgotado</span>':""}</div>`:""}
      ${p.descricao?`<p class="desc">${esc(p.descricao)}</p>`:""}
      ${det.length?`<dl class="detalhes">${det.map(d=>`<div><dt>${d[0]}</dt><dd>${esc(d[1])}</dd></div>`).join("")}</dl>`:""}
      ${num(p.preco)?`<div class="tabela-precos">${linhas.map(l=>`<div class="${l.a?"ativo":""}"><span>${l.t}</span><span>${brl(l.v)} cada</span></div>`).join("")}</div>
      <div class="qtd"><div class="ctrl"><button data-q="-1" aria-label="Diminuir">−</button><input id="q" inputmode="numeric" value="${q}" aria-label="Quantidade"><button data-q="1" aria-label="Aumentar">+</button></div><span>Total: <span class="total">${brl(pr*q)}</span></span></div>`:`<p class="desc">Preço sob consulta – chame no WhatsApp.</p>`}
      ${p.status==="esgotado"?`<p class="desc" style="color:var(--alerta)">Esgotado no momento. Chame no WhatsApp para encomendar.</p>`:""}
      <div class="acoes">${zap?`<a class="btn btn-zap" href="${zap}" target="_blank" rel="noopener">Pedir pelo WhatsApp</a>`:""}</div></div></div>`;
    if(!dlg.open)dlg.showModal();
    $(".fechar",dlg).onclick=()=>dlg.close();
    dlg.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{idx=+b.dataset.i;desenhar()});
    dlg.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{q=Math.max(1,q+ +b.dataset.q);desenhar()});
    const qi=$("#q",dlg); if(qi)qi.onchange=()=>{q=Math.max(1,parseInt(qi.value)||1);desenhar()};
  }
  desenhar(); if(/^[A-Za-z0-9-]+$/.test(id))history.replaceState(null,"","#peca-"+id);
}
render();
const h=location.hash.match(/^#peca-([A-Za-z0-9-]+)$/); if(h)abrirPeca(h[1]);
})();
</script>
</body></html>
